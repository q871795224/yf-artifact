<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>战场特效工作台</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:dark;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#10191c;color:#e4e2d8}
*{box-sizing:border-box}
body{margin:0;height:100dvh;display:grid;grid-template-rows:auto minmax(360px,1fr) auto}
header,footer{display:flex;align-items:center;gap:18px;padding:14px clamp(14px,3vw,42px);background:#172226}
header{border-bottom:1px solid #354549}
h1{font-family:"Songti SC","Noto Serif CJK SC",Georgia,serif;font-size:clamp(19px,2vw,27px);margin:0;white-space:nowrap}
header a{margin-left:auto;color:#b5c9c7;text-underline-offset:4px;white-space:nowrap}
header .secondary{display:flex;align-items:center;gap:12px;margin-left:auto}
nav,.transport,.angle{display:flex;align-items:center;gap:8px}
button,select{color:inherit;background:#233135;border:1px solid #4a575a;border-radius:4px;font:inherit;padding:6px 13px;white-space:nowrap}
button{cursor:pointer}
button:disabled,select:disabled{opacity:.56;cursor:default}
button[aria-pressed=true]{background:#3b4b41;color:#e4eedc;border-color:#8da28a}
button:focus-visible,select:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #baddba;outline-offset:3px}
main{position:relative;min-height:360px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#loading{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);padding:16px 22px;background:#1b292c;border:1px solid #526164;max-width:min(600px,90vw)}
footer{border-top:1px solid #354549}
.transport{flex:1}
#timeline{min-width:75px;flex:1;accent-color:#b0c7a5}
.angle{margin-left:auto;white-space:nowrap;color:#c3ccca}
#angle{width:110px;accent-color:#b0c7a5}
#time{min-width:4.5em;font-variant-numeric:tabular-nums;color:#c3ccca}
dialog{width:min(390px,92vw);max-height:94dvh;padding:12px;border:1px solid #748681;border-radius:6px;background:#172226;color:inherit}
dialog::backdrop{background:#071013bf}
dialog form{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
dialog img{display:block;width:100%;height:min(65dvh,600px);object-fit:contain}
@media(max-width:760px){header,footer{flex-wrap:wrap;gap:9px}.transport{flex-basis:100%}.angle{margin-left:0}header a{margin-left:0}nav{order:3;flex-basis:100%}}
@media(max-width:480px){.transport{flex-wrap:wrap}.transport label{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}#timeline{min-width:48px}.transport button,.transport select{padding-inline:8px}header .secondary{margin-left:0}}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<header>
  <h1>战场特效工作台</h1>
  <nav aria-label="演示效果">
    <button data-effect="0" data-duration="0.8" aria-pressed="true" disabled>近战挥砍</button>
    <button data-effect="1" data-duration="1.05" aria-pressed="false" disabled>防御塔炮击</button>
    <button data-effect="2" data-duration="1.2" aria-pressed="false" disabled>范围法术</button>
  </nav>
  <div class="secondary"><button id="inspect" disabled>看卡图</button><a href="../../">二维工作台</a></div>
</header>
<main>
  <canvas id="canvas" aria-label="俯视 3D 战场"></canvas>
  <div id="loading" role="status">正在加载 3D 棋盘…</div>
</main>
<footer>
  <div class="transport">
    <button id="replay" disabled>重播</button>
    <button id="play" disabled>播放</button>
    <label for="timeline">进度</label>
    <input id="timeline" type="range" min="0" max="1000" value="0" disabled>
    <output id="time" for="timeline">0.00 秒</output>
    <select id="rate" aria-label="播放速度" disabled>
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
    </select>
  </div>
  <label class="angle">俯视角 <input id="angle" type="range" min="48" max="82" value="55" disabled> <output id="degrees" for="angle">55°</output></label>
</footer>
<dialog id="portrait" aria-label="卡牌插画">
  <form method="dialog">
    <select id="portrait-card" aria-label="选择卡牌" autofocus>
      <option value="10032">卓尔游侠</option><option value="10022">伐木机</option>
      <option value="61007">萌芽守卫</option><option value="61006">先锋掷斧手</option>
    </select>
    <button>关闭</button>
  </form>
  <img id="portrait-image" alt="">
</dialog>
<script src="$GODOT_URL"></script>
<script>
const buttons = [...document.querySelectorAll("[data-effect]")];
const replay = document.querySelector("#replay");
const play = document.querySelector("#play");
const timeline = document.querySelector("#timeline");
const time = document.querySelector("#time");
const angle = document.querySelector("#angle");
const degrees = document.querySelector("#degrees");
const rate = document.querySelector("#rate");
const loading = document.querySelector("#loading");
const canvas = document.querySelector("#canvas");
const stage = canvas.parentElement;
const inspect = document.querySelector("#inspect");
const portrait = document.querySelector("#portrait");
const portraitCard = document.querySelector("#portrait-card");
const portraitImage = document.querySelector("#portrait-image");
function resizeCanvas() {
  const scale = Math.min(window.devicePixelRatio || 1, 2);
  const width = Math.max(1, Math.round(stage.clientWidth * scale));
  const height = Math.max(1, Math.round(stage.clientHeight * scale));
  if (canvas.width !== width) canvas.width = width;
  if (canvas.height !== height) canvas.height = height;
}
resizeCanvas();
new ResizeObserver(resizeCanvas).observe(stage);
let duration = Number(buttons[0].dataset.duration);
let isPlaying = false;
window.stageReady = () => {
  loading.hidden = true;
  for (const control of [...buttons,replay,play,timeline,angle,rate,inspect]) control.disabled = false;
};
window.stageProgress = (fraction, playing) => {
  timeline.value = Math.round(fraction * 1000);
  time.value = `${(fraction * duration).toFixed(2)} 秒`;
  isPlaying = playing;
  play.textContent = playing ? "暂停" : "播放";
};
function updatePortrait() {
  portraitImage.src = `../art/${portraitCard.value}.webp`;
  portraitImage.alt = portraitCard.selectedOptions[0].textContent;
}
window.stageInspect = card => {
  portraitCard.value = String(card);
  if (isPlaying) play.click();
  updatePortrait();
  if (!portrait.open) portrait.showModal();
};
portraitCard.addEventListener("change", updatePortrait);
inspect.addEventListener("click", () => window.stageInspect(portraitCard.value));
canvas.addEventListener("click", event => {
  if (inspect.disabled) return;
  const bounds = canvas.getBoundingClientRect();
  window.stageCommand("inspect", (event.clientX - bounds.left) / bounds.width, (event.clientY - bounds.top) / bounds.height);
});
for (const button of buttons) button.addEventListener("click", () => {
  window.stageCommand("select", Number(button.dataset.effect));
  duration = Number(button.dataset.duration);
  for (const item of buttons) item.setAttribute("aria-pressed", String(item === button));
  window.stageProgress(0, false);
  window.stageCommand("replay");
});
replay.addEventListener("click", () => window.stageCommand("replay"));
play.addEventListener("click", () => {
  if (isPlaying) {
    window.stageCommand("pause");
    window.stageProgress(Number(timeline.value) / 1000, false);
  } else window.stageCommand("resume");
});
timeline.addEventListener("input", () => {
  const fraction = Number(timeline.value) / 1000;
  window.stageCommand("seek", fraction);
  window.stageProgress(fraction, false);
});
angle.addEventListener("input", () => {
  degrees.value = `${angle.value}°`;
  window.stageCommand("camera", Number(angle.value));
});
rate.addEventListener("change", () => window.stageCommand("rate", Number(rate.value)));
const engine = new Engine($GODOT_CONFIG);
engine.startGame({canvas,args:["--audio-driver","Dummy"],onProgress:(done,total) => {
  if (total > 0) loading.textContent = `正在加载 3D 棋盘 · ${Math.min(100,Math.round(done / total * 100))}%`;
}}).catch(error => {
  loading.textContent = "3D 棋盘启动失败。可用支持 WebGL 2.0 的桌面浏览器重新打开。";
  console.error(error);
});
</script>
</body>
</html>
