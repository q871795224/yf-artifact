<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>插画审阅 · yf-artifact</title>
  <link rel="icon" href="../references/artifact-classic/assets/mobile/mini_image/1006.webp">
  <link rel="stylesheet" href="art-review.css">
  <script src="art-review.js" defer></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="art-review.html"><span class="brand-icon" aria-hidden="true">◇</span> yf-artifact</a>
    <nav aria-label="其他页面"><a href="assets.html">原版素材工具</a><a href="index.html">特效工作台</a></nav>
  </header>
  <main class="workspace">
    <section class="intro" aria-labelledby="page-title">
      <div>
        <h1 id="page-title">插画审阅</h1>
        <p>看试玩现在用哪张图，挑下一批值得留下或重画的候选。</p>
      </div>
      <div id="featured" class="featured" aria-label="候选插画速览"></div>
    </section>
    <nav class="collections" aria-label="素材集合">
      <button data-collection="current" aria-pressed="true">当前卡池 <span></span></button>
      <button data-collection="candidate" aria-pressed="false">项目候选 <span></span></button>
      <button data-collection="classic" aria-pressed="false">Artifact Classic <span></span></button>
    </nav>
    <div class="filters">
      <label class="search">搜索<input id="search" type="search" placeholder="名称、英文名或 ID" autocomplete="off"></label>
      <label>类型<select id="type"></select></label>
      <label>颜色<select id="color"><option value="">全部颜色</option><option value="red">红</option><option value="green">绿</option><option value="blue">蓝</option><option value="black">黑</option><option value="neutral">无色</option></select></label>
      <label id="source-label">用图<select id="source"></select></label>
      <label>审阅<select id="review"><option value="">全部状态</option><option value="revise">需要修改</option><option value="keep">保留</option><option value="new">未标记</option></select></label>
    </div>
    <div class="gallery-bar">
      <p id="result-status" role="status">正在载入素材…</p>
      <div>
        <button id="small-view" aria-pressed="false">小图检查</button>
        <button id="compare-open" disabled>并排对照 <span id="compare-count">0/2</span></button>
      </div>
    </div>
    <div id="gallery" class="gallery" aria-label="插画列表"></div>
    <button id="load-more" hidden>显示更多</button>
    <p id="compare-status" class="sr-only" role="status"></p>
  </main>
  <dialog id="detail" aria-labelledby="detail-title">
    <header class="dialog-head">
      <div><p id="detail-meta"></p><h2 id="detail-title"></h2></div>
      <button class="close" data-close aria-label="关闭详情">×</button>
    </header>
    <div class="detail-layout">
      <div>
        <div id="detail-picture" class="detail-picture"></div>
        <div class="image-controls"><label>图片<select id="detail-version"></select></label><a id="open-image" target="_blank" rel="noopener">打开原图 ↗</a></div>
      </div>
      <div class="detail-info">
        <div id="card-copy"></div>
        <label>审阅状态<select id="detail-review"><option value="">未标记</option><option value="keep">保留</option><option value="revise">需要修改</option></select></label>
        <label>修改意见<textarea id="detail-note" rows="4" placeholder="例如：缩小后看不清手里的武器"></textarea></label>
        <p id="note-status" class="hint" role="status">意见保存在当前浏览器。</p>
        <button id="detail-compare" aria-pressed="false">加入对照</button>
      </div>
    </div>
  </dialog>
  <dialog id="compare" aria-labelledby="compare-title">
    <header class="dialog-head">
      <h2 id="compare-title">并排对照</h2>
      <button class="close" data-close aria-label="关闭对照">×</button>
    </header>
    <div id="compare-images"></div>
  </dialog>
</body>
</html>
