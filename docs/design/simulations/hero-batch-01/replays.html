<h1>英雄能力推演</h1>
<p>逐步观察走位、技能与交战。有限回合战场实验；不含建筑、装备与正式牌库，不判推塔胜负。</p>

games.forEach((g,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${i+1}. ${g.rosters.map(r=>r.map(id=>heroName(g,id)).join('／')).join(' 对 ')} · ${g.mode} · seed ${g.seed}`;$('game').append(option)});
function stop(){clearInterval(timer);timer=null;$('play').textContent='播放'}
function render(){const g=games[Number($('game').value)||0];if(!g)return;const frames=g.frames;$('step').max=frames.length-1;const n=Math.min(Number($('step').value),frames.length-1),f=frames[n];$('phase').textContent=`第 ${f.round} 轮 · ${f.phase} · ${n+1}/${frames.length}`;$('previous').disabled=n===0;$('next').disabled=n===frames.length-1;$('status').innerHTML=`<span class="sideA">A 金币 ${f.gold[0]} · 法力 ${f.mana[0]}</span><span class="sideB">B 金币 ${f.gold[1]} · 法力 ${f.mana[1]}</span>`;let html='';for(let r=0;r<8;r++)for(let c=0;c<6;c++){const u=f.units.find(x=>x.r===r&&x.c===c);html+=`<div class="cell ${r===0||r===7?'fountain':''} ${r===4?'mid':''}">`;if(u){const cd=u.hero?` · CD ${u.cd}`:'';html+=`<div class="unit" style="--color:${colors[u.hero]||'#75818b'}" title="${escape(u.id)} · (${r+1},${c+1})"><span class="arrow">${u.arrow}</span><span class="name side${'AB'[u.team]}">${'AB'[u.team]} ${escape(u.name)}</span><span class="detail">血 ${u.hp}/${u.max_hp}</span><span class="detail">攻 ${u.attack} · 甲 ${u.armor}</span><span class="detail ${u.stunned?'stun':''}">${u.stunned?'眩晕':''}${cd}</span></div>`}html+='</div>'}$('board').innerHTML=html;$('events').innerHTML=f.events.length?f.events.map(e=>`<p>${escape(e)}</p>`).join(''):'<p>棋盘与本轮箭头已公开。</p>';$('lineups').innerHTML=g.rosters.map((r,i)=>`${'AB'[i]}：${r.map(id=>escape(heroName(g,id))).join('／')}`).join('<br>')}
function advance(delta){const max=Number($('step').max);$('step').value=Math.max(0,Math.min(max,Number($('step').value)+delta));render();if(Number($('step').value)===max)stop()}
$('game').onchange=()=>{stop();$('step').value=0;render()};$('step').oninput=()=>{stop();render()};$('previous').onclick=()=>{stop();advance(-1)};$('next').onclick=()=>{stop();advance(1)};$('play').onclick=()=>{if(timer){stop();return}if(Number($('step').value)===Number($('step').max))$('step').value=0;timer=setInterval(()=>advance(1),650);$('play').textContent='暂停'};render();
</script>
</html>
